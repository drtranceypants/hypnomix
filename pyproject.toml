[project]
name = "hypnomix"
version = "0.1.0"
description = "A mixing and mastering engineer for Ableton Live and REAPER: automix stems, master, align vocals, match clips, check releases. Built to be driven by Claude Code."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "soundfile>=0.12",
  "sounddevice>=0.4.6",
  "pyloudnorm>=0.1.1",
  "librosa>=0.10",
  "matplotlib>=3.6",
  "python-osc>=1.8",
  "noisereduce>=3.0",
]

[project.optional-dependencies]
# GPL-3.0: kept optional so hypnomix itself stays MIT
reference = ["matchering>=2.0"]
ml = ["audio-separator>=0.30", "basic-pitch>=0.4"]
# `critique` and the Assistant's Listening: Gemini or OpenRouter, both through the OpenAI-compatible client
critique = ["openai>=1.0"]
# the app's Assistant tab: bring your own key from Anthropic or any OpenAI-compatible provider
assistant = ["anthropic>=1.0", "openai>=1.0"]
# GPL-3.0: kept optional so hypnomix itself stays MIT. Hosts VST3 / AU plug-ins for `hypnomix plugrender`
plugins = ["pedalboard>=0.9"]

[project.scripts]
hypnomix = "hypnomix.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hypnomix"]


# the PDF guides' Markdown is also the app's wiki (hypnomix/app/wiki.py reads it from here when installed)
[tool.hatch.build.targets.wheel.force-include]
"docs/guides" = "hypnomix/app/wiki/guides"
# and so are the documents in docs/ (listed one by one: docs/launch/ holds drafts that must not ship)
"README.md" = "hypnomix/app/wiki/docs/README.md"
"GUIDE.md" = "hypnomix/app/wiki/docs/GUIDE.md"
"AGENTS.md" = "hypnomix/app/wiki/docs/AGENTS.md"
"THIRD_PARTY.md" = "hypnomix/app/wiki/docs/THIRD_PARTY.md"
"docs/ALIGN.md" = "hypnomix/app/wiki/docs/ALIGN.md"
"docs/APP.md" = "hypnomix/app/wiki/docs/APP.md"
"docs/LESSONS.md" = "hypnomix/app/wiki/docs/LESSONS.md"
"docs/LIBRARY.md" = "hypnomix/app/wiki/docs/LIBRARY.md"
"docs/LIVE.md" = "hypnomix/app/wiki/docs/LIVE.md"
"docs/MASTERING.md" = "hypnomix/app/wiki/docs/MASTERING.md"
"docs/PLUGINS.md" = "hypnomix/app/wiki/docs/PLUGINS.md"
"docs/REAPER.md" = "hypnomix/app/wiki/docs/REAPER.md"
"docs/ROADMAP.md" = "hypnomix/app/wiki/docs/ROADMAP.md"
"docs/TEMPO.md" = "hypnomix/app/wiki/docs/TEMPO.md"
"docs/WORKFLOW.md" = "hypnomix/app/wiki/docs/WORKFLOW.md"
