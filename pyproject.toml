[project]
name = "hypnomix"
version = "0.1.0"
description = "A mixing and mastering engineer for Ableton Live: automix stems, master, align vocals, match clips, check releases. Built to be driven by Claude Code."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "soundfile>=0.12",
  "sounddevice>=0.4.6",
  "pyloudnorm>=0.1.1",
  "librosa>=0.10",
  "matplotlib>=3.6",
  "python-osc>=1.8",
  "noisereduce>=3.0",
]

[project.optional-dependencies]
# GPL-3.0: kept optional so hypnomix itself stays MIT
reference = ["matchering>=2.0"]
ml = ["audio-separator>=0.30", "basic-pitch>=0.4"]
critique = ["google-genai>=1.0"]
# the app's Assistant tab: bring your own key from Anthropic or any OpenAI-compatible provider
assistant = ["anthropic>=1.0", "openai>=1.0"]
# GPL-3.0: kept optional so hypnomix itself stays MIT. Hosts VST3 / AU plug-ins for `hypnomix plugrender`
plugins = ["pedalboard>=0.9"]

[project.scripts]
hypnomix = "hypnomix.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hypnomix"]

