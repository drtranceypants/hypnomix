name: Bug report
description: Something broke, gave a wrong result, or didn't do what the docs say.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **HypnoMix can write this for you.** In the app, click **Report a problem** (top right); in a terminal, run `hypnomix report --copy` (or `hypnomix report --crash --copy` after a crash). It shows you the report first, hides your paths, file and track names and keys, and sends nothing itself: you paste it here. The boxes below have the same names as the report's sections, so a pasted report fits.

        This page is public. Please don't attach audio or whole sets, and take out anything personal (your name in file paths, a song you haven't released) before you post.
        If an AI agent helped you find this, it's welcome to fill the form in with you.
  - type: textarea
    id: report
    attributes:
      label: The report from HypnoMix
      description: "Paste the whole report here if you have one. Then the boxes below can be left short or empty, except \"What happened\"."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: "In your words: what you did (the command or button, and on what: a Live set, a REAPER project, a HypnoMix DAW session, a folder of stems, one file) and what you saw. If the report above says it all, write \"see the report\"."
      placeholder: "hypnomix scan Song.als, then Approve on the first finding in Review: the page went blank"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What I expected
  - type: textarea
    id: setup
    attributes:
      label: Version and setup
      description: "The report's \"Version and setup\" section. Without a report, give the HypnoMix version (the download page, or `git rev-parse --short HEAD` from source), how you run it (the Mac or Windows app, the terminal, an AI agent, the Live device, the REAPER panels), your computer and DAW, and the output of `hypnomix doctor` (it changes nothing)."
      render: text
  - type: textarea
    id: lastran
    attributes:
      label: What ran last
      description: "The report's \"What ran last\" section: the last command or job and how it ended."
  - type: textarea
    id: log
    attributes:
      label: Log
      description: "The report's \"Log\" section, or the end of the Activity log in the app, the terminal output, or the lines from REVIEW.md for a wrong finding."
      render: text
  - type: textarea
    id: crash
    attributes:
      label: Crash record
      description: "The report's \"Crash record\" section, if HypnoMix said it hit a bug."
  - type: textarea
    id: scan
    attributes:
      label: Findings in the open scan
      description: "The report's \"Findings in the open scan\" section: how many findings each tool made (counts only)."
