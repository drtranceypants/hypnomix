# Scans a release's installers with public virus scanners and publishes the reports with the release:
#   Microsoft Defender (on GitHub's Windows runner, signatures updated first)
#   ClamAV (on GitHub's Linux runner, signatures updated first)
#   VirusTotal (about 70 engines plus sandbox behaviour reports) when the repository has a VT_API_KEY secret:
#     a free account at virustotal.com → your profile → API key → GitHub repo Settings → Secrets → Actions → VT_API_KEY
# The release gets SECURITY-SCAN.md (every engine's verdict, signature versions, the files' SHA-256) and a
# summary in its notes. Runs after every tagged installer build, or by hand: Actions → scan-release → Run workflow.
#
# The gate: a tagged build makes a DRAFT release (installers.yml) and calls this with publish: true. Only when
# Defender, ClamAV and every VirusTotal engine find nothing in all three installers is the draft published and made
# the latest release (which the download page and the app's updater follow). Otherwise it stays a draft, nobody
# gets it, and this run fails naming the engine. A machine-learning engine can flag one particular build of
# unchanged code (v0.1.4's Apple silicon image: Microsoft's Wacatac.B!ml; two rebuilds of the same tag were clean),
# so the usual fix is to cut the next version and let it be scanned again.
name: scan-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to scan (e.g. v0.1.1)"
        required: true
      publish:
        description: "Publish the draft and make it the latest release if every scan is clean"
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      publish:
        type: boolean
        default: false
    secrets:
      VT_API_KEY:
        required: false

permissions:
  contents: write

env:
  FILES: "Hypnomix-mac-arm64.dmg Hypnomix-mac-intel.dmg Hypnomix-windows-setup.exe"
  TAG: ${{ inputs.tag }}      # used only as "$TAG" / $env:TAG, never written into a script, and checked first in every job

jobs:
  defender:
    runs-on: windows-latest
    steps:
      - name: Check the tag
        shell: pwsh
        run: |
          if ($env:TAG -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?\z') { throw "The tag must be a release version like v0.1.1." }
      - name: Download the installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory dist | Out-Null
          foreach ($f in $env:FILES.Split(" ")) { gh release download $env:TAG -R $env:GITHUB_REPOSITORY -p $f -D dist }
      - name: Microsoft Defender scan
        shell: pwsh
        run: |
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          $out = @("## Microsoft Defender", "")
          if (-not (Test-Path $mp)) { $out += "Not available on this runner."; $out | Set-Content defender.md; exit 0 }
          & $mp -SignatureUpdate | Out-Null
          $st = Get-MpComputerStatus
          $out += "Engine $($st.AMEngineVersion), signatures $($st.AntivirusSignatureVersion) (updated $($st.AntivirusSignatureLastUpdated))", ""
          $bad = 0
          foreach ($f in Get-ChildItem dist) {
            $r = & $mp -Scan -ScanType 3 -File $f.FullName -DisableRemediation 2>&1 | Out-String
            $code = $LASTEXITCODE
            $verdict = if ($code -eq 0) { "no threats found" } elseif ($code -eq 2) { $bad++; "THREAT FOUND" } else { "scan error ($code)" }
            Write-Host "$($f.Name): $verdict`n$r"
            $out += "- ``$($f.Name)``: $verdict"
          }
          $out | Set-Content defender.md
          if ($bad) { exit 1 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: defender, path: defender.md }

  clamav:
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag
        run: |
          re='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          [[ "$TAG" =~ $re ]] || { echo "::error::The tag must be a release version like v0.1.1."; exit 1; }
      - name: Download the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          for f in $FILES; do gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$f" -D dist; done
          (cd dist && sha256sum *) | tee sums.txt
      - name: ClamAV scan
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clamav > /dev/null
          sudo systemctl stop clamav-freshclam 2>/dev/null || true
          sudo freshclam --quiet || sudo freshclam
          ver=$(clamscan --version)
          { echo "## ClamAV"; echo; echo "$ver"; echo; } > clamav.md
          bad=0
          for f in dist/*; do
            r=$(clamscan --no-summary --max-filesize=1000M --max-scansize=4000M --max-files=200000 --max-recursion=30 "$f" 2>&1) && v="no threats found" || { [ $? -eq 1 ] && { v="THREAT FOUND: $r"; bad=1; } || v="scan error: $r"; }
            echo "$(basename "$f"): $v"
            echo "- \`$(basename "$f")\`: $v" >> clamav.md
          done
          echo >> clamav.md; echo '```' >> clamav.md; cat sums.txt >> clamav.md; echo '```' >> clamav.md
          exit $bad
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: clamav, path: clamav.md }

  virustotal:
    runs-on: ubuntu-latest
    env:
      HAS_VT: ${{ secrets.VT_API_KEY != '' }}
    steps:
      - name: Check the tag
        run: |
          re='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          [[ "$TAG" =~ $re ]] || { echo "::error::The tag must be a release version like v0.1.1."; exit 1; }
      - name: Download the installers
        if: env.HAS_VT == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          for f in $FILES; do gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$f" -D dist; done
      - name: Upload to VirusTotal and wait for every engine's verdict
        env:
          VT: ${{ secrets.VT_API_KEY }}
        run: |
          {
            echo "## VirusTotal"; echo
            if [ "$HAS_VT" != "true" ]; then
              echo "Not run: the repository has no VT_API_KEY secret yet. A release is not published without a VirusTotal verdict."
            else
              echo "About 70 antivirus engines, plus sandbox behaviour where VirusTotal runs one. Each link shows the latest verdicts:"; echo
            fi
          } > virustotal.md
          if [ "$HAS_VT" != "true" ]; then
            cat virustotal.md
            echo "::error::VirusTotal did not run: the repository has no VT_API_KEY secret. Add it (Settings, Secrets and variables, Actions), then run scan-release again for this tag. A release is not published without a VirusTotal verdict."
            exit 1
          fi
          api() { sleep 16; curl -sS -H "x-apikey: $VT" "$@"; }      # the free API allows 4 requests a minute
          bad=0
          for f in dist/*; do
            name=$(basename "$f"); sha=$(sha256sum "$f" | cut -d' ' -f1)
            url=$(api https://www.virustotal.com/api/v3/files/upload_url | jq -r .data)
            id=$(curl -sS -H "x-apikey: $VT" -F "file=@$f" "$url" | jq -r .data.id)
            [ -n "$id" ] && [ "$id" != null ] || { echo "- \`$name\`: upload failed" >> virustotal.md; bad=1; continue; }
            r=""; for i in $(seq 1 80); do                            # up to about 25 minutes for a big file
              r=$(api "https://www.virustotal.com/api/v3/analyses/$id")
              [ "$(echo "$r" | jq -r .data.attributes.status)" = completed ] && break
            done
            if [ "$(echo "$r" | jq -r .data.attributes.status)" != completed ]; then
              v="analysis not finished in time"; bad=1
            else
              n=$(echo "$r" | jq '.data.attributes.stats | .malicious + .suspicious')
              of=$(echo "$r" | jq '.data.attributes.stats | .malicious + .suspicious + .undetected + .harmless')
              who=$(echo "$r" | jq -r '[.data.attributes.results[] | select(.category == "malicious" or .category == "suspicious") | "\(.engine_name): \(.result)"] | join("; ")')
              if [ "$n" = 0 ]; then v="no engine flags it (0 / $of)"; else v="FLAGGED by $n / $of: $who"; bad=1; fi
            fi
            echo "$name: $v"
            echo "- \`$name\`: $v · https://www.virustotal.com/gui/file/$sha" >> virustotal.md
          done
          cat virustotal.md
          exit $bad
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: virustotal, path: virustotal.md }

  report:
    needs: [defender, clamav, virustotal]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag
        run: |
          re='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          [[ "$TAG" =~ $re ]] || { echo "::error::The tag must be a release version like v0.1.1."; exit 1; }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { merge-multiple: true }
      - name: Attach SECURITY-SCAN.md and a summary to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "# Security scan: HypnoMix $TAG"; echo
            echo "Scanned $(date -u +'%Y-%m-%d %H:%M UTC') by GitHub Actions run $GITHUB_RUN_ID ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."; echo
            for f in defender.md clamav.md virustotal.md; do [ -f "$f" ] && { cat "$f"; echo; } || echo "_${f%.md}: no report (the job failed; see the run)_"; done
          } > SECURITY-SCAN.md
          cat SECURITY-SCAN.md
          gh release upload "$TAG" SECURITY-SCAN.md -R "$GITHUB_REPOSITORY" --clobber
          notes=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body --jq .body | sed '/^## Security scan/,$d')
          summary=$(grep -E '^- `|^Not run|^Engine|^ClamAV' SECURITY-SCAN.md | head -20)
          printf '%s\n\n## Security scan\n\n%s\n\nFull report: SECURITY-SCAN.md (attached).\n' "$notes" "$summary" > notes.md
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file notes.md
      - name: Publish the release, only if every scan is clean
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: "defender=${{ needs.defender.result }} clamav=${{ needs.clamav.result }} virustotal=${{ needs.virustotal.result }}"
        run: |
          echo "$RESULTS"
          # VirusTotal has to have actually run and returned a verdict for every installer: no key means no publish
          if [ ! -f virustotal.md ] || grep -q '^Not run' virustotal.md; then
            echo "::error::Not published: VirusTotal did not run (the repository has no VT_API_KEY secret, or its report is missing). The release stays a draft, so nobody gets it. Add the VT_API_KEY secret, then run scan-release again for this tag with publish ticked."
            exit 1
          fi
          if [ "$RESULTS" != "defender=success clamav=success virustotal=success" ]; then
            echo "::error::Not published: a scan flagged an installer or did not finish ($RESULTS). The release stays a draft, so nobody gets it. See SECURITY-SCAN.md on the draft; usually the fix is to cut the next version."
            exit 1
          fi
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest
          echo "Published $TAG as the latest release."
