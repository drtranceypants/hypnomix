# Builds the one-click installers: a .dmg for Apple silicon and Intel Macs, and a Windows setup .exe.
# Run it by hand (Actions → installers → Run workflow) to get them as downloadable build artifacts, or push a
# version tag (git tag v0.1.0 && git push origin v0.1.0) to also attach them to a GitHub release. The website's
# download buttons point at https://github.com/drtranceypants/hypnomix/releases/latest/download/<file>.
#
# Optional repository secrets for signing (without them the installers are unsigned and people allow them once):
#   MACOS_CERT_P12, MACOS_CERT_PASSWORD   a Developer ID Application certificate, base64-encoded .p12
#   MACOS_SIGN_ID                          e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   for notarisation (an app-specific password)
name: installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# The build jobs run pip/uv installs, so they only get a read-only token. Only the jobs that publish get more.
permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-latest
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_APP_PASSWORD != '' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Import the signing certificate
        if: ${{ env.HAS_CERT == 'true' }}
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/build.keychain"
          security create-keychain -p ci "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p ci "$kc"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
      - name: Save notarisation credentials
        if: ${{ env.HAS_NOTARY == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials hypnomix --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          echo "HYPNOMIX_NOTARY_PROFILE=hypnomix" >> "$GITHUB_ENV"
      - name: Build
        env:
          HYPNOMIX_SIGN_ID: ${{ secrets.MACOS_SIGN_ID }}
          ARCH: ${{ matrix.arch }}
        run: packaging/mac/build_dmg.sh "$ARCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac-${{ matrix.arch }}
          path: packaging/dist/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Inno Setup (if the runner image lacks it)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - name: Smoke test (silent install, the app answers, uninstall)
        shell: pwsh
        run: |
          $setup = (Get-ChildItem packaging/dist/*-setup.exe | Select-Object -First 1).FullName
          Set-Location $env:RUNNER_TEMP          # away from the checkout, so python -m imports the INSTALLED hypnomix
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/TASKS=", "/DIR=$env:RUNNER_TEMP\hx" -Wait
          $env:PATH = "$env:RUNNER_TEMP\hx\bin;" + $env:PATH     # as the Start menu launcher sets it
          $doc = & "$env:RUNNER_TEMP\hx\python\python.exe" -m hypnomix.cli doctor 2>&1 | Out-String
          Write-Host $doc
          # doctor exits 1 here because Live's remote script isn't installed on the runner; check the rows that matter
          if ($doc -notmatch "Python packages\s+all present") { throw "packages missing in the installed app" }
          if ($doc -notmatch "ffmpeg\s+.*\\hx\\bin\\ffmpeg") { throw "the installed app doesn't find its own ffmpeg" }
          & "$env:RUNNER_TEMP\hx\python\python.exe" -c "import hypnomix, sys; p = hypnomix.__file__; print(p); sys.exit(0 if 'hx' in p else 1)"
          if ($LASTEXITCODE) { throw "hypnomix was imported from somewhere other than the install folder" }
          Start-Process "$env:RUNNER_TEMP\hx\python\pythonw.exe" -ArgumentList "`"$env:RUNNER_TEMP\hx\launcher.pyw`""
          $ok = $false
          foreach ($i in 1..120) {
            try { if ((Invoke-WebRequest http://127.0.0.1:8791/api/state -UseBasicParsing -TimeoutSec 2).StatusCode -eq 200) { $ok = $true; break } } catch {}
            Start-Sleep -Milliseconds 500
          }
          if (-not $ok) { Get-Content "$env:LOCALAPPDATA\Hypnomix\server.log" -ErrorAction SilentlyContinue; throw "the app did not answer" }
          Write-Host "app answered on 8791"
          # in-place update, as the app's Update button does it: a helper (started outside the server's process tree)
          # runs the setup silently over this install, which stops the server, then starts hypnomix again
          $log = "$env:USERPROFILE\.hypnomix\updates\update.log"
          & "$env:RUNNER_TEMP\hx\python\python.exe" -m hypnomix.app.update install $setup | Out-Null
          if ($LASTEXITCODE) { throw "the updater didn't start" }
          $done = $false
          foreach ($i in 1..360) {
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern "setup exit 0" -Quiet)) { $done = $true; break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $done) { Get-Content $log -ErrorAction SilentlyContinue; throw "the silent update didn't finish" }
          $ok = $false
          foreach ($i in 1..120) {
            try { if ((Invoke-WebRequest http://127.0.0.1:8791/api/update/state -UseBasicParsing -TimeoutSec 2).StatusCode -eq 200) { $ok = $true; break } } catch {}
            Start-Sleep -Milliseconds 500
          }
          if (-not $ok) { Get-Content $log; Get-Content "$env:LOCALAPPDATA\Hypnomix\server.log" -ErrorAction SilentlyContinue; throw "hypnomix didn't come back after the update" }
          Write-Host "updated in place and answering again"
          & "$env:RUNNER_TEMP\hx\python\pythonw.exe" "$env:RUNNER_TEMP\hx\launcher.pyw" --stop
          Start-Process "$env:RUNNER_TEMP\hx\unins000.exe" -ArgumentList "/VERYSILENT" -Wait
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64
          path: packaging/dist/*-setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the draft release and attach the installers
      id-token: write        # build provenance: anyone can check a download was built here from this source
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Stable names for the website's download buttons
        run: |
          cd dist
          for f in *-mac-arm64.dmg;  do cp "$f" Hypnomix-mac-arm64.dmg; done
          for f in *-mac-x86_64.dmg; do cp "$f" Hypnomix-mac-intel.dmg; done
          for f in *-windows-x64-setup.exe; do cp "$f" Hypnomix-windows-setup.exe; done
          sha256sum Hypnomix-*.dmg Hypnomix-*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Build provenance (gh attestation verify FILE -R drtranceypants/hypnomix)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: "dist/Hypnomix-*"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a draft: nobody gets it (the download page and the app's updater follow the latest published release)
          # until scan-release finds every installer clean and publishes it
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft --title "HypnoMix $GITHUB_REF_NAME" \
              --notes "Installers: Mac (Apple silicon or Intel) and Windows. See the README's Install section."
          gh release upload "$GITHUB_REF_NAME" dist/* -R "$GITHUB_REPOSITORY" --clobber

  scan:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    permissions:
      contents: write        # scan-release reads the draft, attaches the report and publishes it
    uses: ./.github/workflows/scan-release.yml
    with:
      tag: ${{ github.ref_name }}
      publish: true
    secrets: inherit
